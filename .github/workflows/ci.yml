name: KSHC CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Foundation and scoring tests
        run: npm test

      - name: Agentic AI cost, all four phases, app guidance and safety checks
        run: node scripts/test-khpos-agentic-ai-budget.mjs && node scripts/test-khpos-app-help.mjs && node scripts/test-khpos-agentic-phases.mjs

      - name: Lint errors
        run: node scripts/lint-errors.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
