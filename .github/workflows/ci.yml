name: KSHC CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full KHP-OS route and inner-screen source audit
        run: node scripts/audit-khpos-ui.mjs

      - name: Upload KHP-OS screen audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khpos-ui-route-audit
          path: |
            artifacts/khpos-ui-route-audit.json
            artifacts/khpos-ui-surface-coverage.json
            artifacts/khpos-ui-manual-test-matrix.md
            artifacts/khpos-every-screen-source-review.json
            artifacts/khpos-every-screen-acceptance.md
          if-no-files-found: warn
          retention-days: 14

      - name: Foundation and scoring tests
        run: npm test

      - name: Agentic costs, four phases, app guides and professional writing
        run: node scripts/test-khpos-agentic-ai-budget.mjs && node scripts/test-khpos-app-help.mjs && node scripts/test-khpos-agentic-phases.mjs && node scripts/test-khpos-writing-assistant.mjs && node scripts/test-khpos-automation-priorities.mjs

      - name: Supabase transient JWT recovery checks
        run: node scripts/test-transient-auth.mjs

      - name: Lint errors
        run: node scripts/lint-errors.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
