name: KHP-OS Lite Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - stage-khpos-lite-distribution
    paths:
      - .github/workflows/android-lite-release.yml
      - android-lite/**
      - public/.well-known/assetlinks.json
      - public/khpos-lite-bootstrap.webmanifest
      - public/khpos-icon-192.png
      - public/khpos-icon-512.png

permissions:
  contents: write

concurrency:
  group: khpos-lite-production-release
  cancel-in-progress: false

jobs:
  build-production-release:
    name: Build signed KHP-OS Lite production release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Require protected production signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KHPOS_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KHPOS_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing KHPOS_ANDROID_KEYSTORE_B64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KHPOS_ANDROID_KEYSTORE_PASSWORD"; exit 1; }

      - name: Prepare production Android project and signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KHPOS_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          rm -rf android-lite/generated-production android-lite/dist-production
          mkdir -p android-lite/generated-production android-lite/dist-production
          cp android-lite/twa-manifest.production.json \
            android-lite/generated-production/twa-manifest.json
          printf '%s' "$KEYSTORE_B64" | base64 --decode \
            > android-lite/generated-production/khpos-lite-production.keystore

      - name: Verify permanent production signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KHPOS_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          FINGERPRINT="$(keytool -list -v \
            -keystore android-lite/generated-production/khpos-lite-production.keystore \
            -alias khpos-lite \
            -storepass "$KEYSTORE_PASSWORD" \
            | awk -F': ' '/SHA256:/{print $2; exit}')"
          EXPECTED="4A:83:6C:70:C0:50:E8:BC:FA:45:CB:35:28:92:EC:6A:0E:21:C9:86:D7:7B:BD:8C:B9:4C:62:FA:52:9B:70:DC"
          test "$FINGERPRINT" = "$EXPECTED" || {
            echo "Production signing certificate does not match the pinned KHP-OS Lite certificate."
            exit 1
          }

      - name: Generate Android project with Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/android-lite/generated-production:/workspace" \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:1.25.0 \
            update \
            --skipVersionUpgrade \
            --manifest=/workspace/twa-manifest.json

      - name: Build signed APK and Android App Bundle
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KHPOS_ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KHPOS_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD \
            -e BUBBLEWRAP_KEY_PASSWORD \
            -v "${PWD}/android-lite/generated-production:/workspace" \
            -w /workspace \
            --entrypoint bash \
            ghcr.io/googlechromelabs/bubblewrap:1.25.0 \
            -lc '
              set -eu
              SDK_ROOT=/root/.bubblewrap/android_sdk
              SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
              test -n "$SDKMANAGER"
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
              "$SDKMANAGER" \
                --sdk_root="$SDK_ROOT" \
                "platforms;android-36" \
                "build-tools;35.0.0" \
                "build-tools;36.1.0"
              bubblewrap build \
                --skipPwaValidation \
                --manifest=/workspace/twa-manifest.json \
                --signingKeyPath=/workspace/khpos-lite-production.keystore \
                --signingKeyAlias=khpos-lite
            '

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("android-lite/twa-manifest.production.json"))["appVersion"])')"
          test -f android-lite/generated-production/app-release-signed.apk
          test -f android-lite/generated-production/app-release-bundle.aab

          cp android-lite/generated-production/app-release-signed.apk \
            android-lite/dist-production/KHP-OS-Lite.apk
          cp android-lite/generated-production/app-release-bundle.aab \
            "android-lite/dist-production/KHP-OS-Lite-${VERSION}.aab"
          sha256sum android-lite/dist-production/* \
            > android-lite/dist-production/SHA256SUMS.txt
          printf '%s' "$VERSION" > android-lite/dist-production/VERSION.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(cat android-lite/dist-production/VERSION.txt)"
          TAG="khpos-lite-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              android-lite/dist-production/KHP-OS-Lite.apk \
              "android-lite/dist-production/KHP-OS-Lite-${VERSION}.aab" \
              android-lite/dist-production/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              android-lite/dist-production/KHP-OS-Lite.apk \
              "android-lite/dist-production/KHP-OS-Lite-${VERSION}.aab" \
              android-lite/dist-production/SHA256SUMS.txt \
              --title "KHP-OS Lite ${VERSION}" \
              --notes "Signed Android distribution shell for the live KHP-OS school transformation platform."
          fi

      - name: Upload signed build artifact
        uses: actions/upload-artifact@v4
        with:
          name: khpos-lite-production-${{ github.sha }}
          path: android-lite/dist-production/
          if-no-files-found: error
          retention-days: 14
